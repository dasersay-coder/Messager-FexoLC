<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FexoLC — Мессенджер</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4xztMw6Lg6hjXBhQmmx7Uu_GNmqEsfAg",
            authDomain: "fexolc.firebaseapp.com",
            projectId: "fexolc",
            storageBucket: "fexolc.firebasestorage.app",
            messagingSenderId: "62913212380",
            appId: "1:62913212380:web:78029ad4fa0bc33d00a919"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUser = null;
        let activeChatWith = null;

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.showRegister = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        };
        window.showLogin = () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        };

        window.register = async function() {
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value.trim();
            
            if (!username || password.length < 6) return alert('Ник и пароль (мин. 6 символов)!');
            
            try {
                const q = query(collection(db, "users"), where("username", "==", username));
                if (!(await getDocs(q)).empty) return alert('Ник занят!');
                
                const randomId = 'fexolc_' + Math.random().toString(36).substring(2, 10);
                
                await addDoc(collection(db, "users"), {
                    username,
                    password: await hashPassword(password),
                    uid: randomId,
                    createdAt: serverTimestamp()
                });
                alert('Аккаунт создан! Ваш ID: ' + randomId);
                showLogin();
            } catch (e) { alert('Ошибка: ' + e.message); }
        };

        window.login = async function() {
            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value.trim();
            
            try {
                const q = query(collection(db, "users"), where("username", "==", username));
                const snap = await getDocs(q);
                if (snap.empty) return alert('Пользователь не найден!');
                
                const userData = snap.docs[0].data();
                if (userData.password !== await hashPassword(password)) return alert('Неверный пароль!');
                
                currentUser = { id: snap.docs[0].id, username: userData.username, uid: userData.uid };
                localStorage.setItem('fexolc_user', JSON.stringify(currentUser));
                enterChat();
            } catch (e) { alert('Ошибка: ' + e.message); }
        };

        function enterChat() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
            document.getElementById('myUsername').textContent = '@' + currentUser.username;
            document.getElementById('myAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            loadGlobalMessages();
        }

        window.logout = () => {
            localStorage.removeItem('fexolc_user');
            location.reload();
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.add('active');
            
            if (tab === 'chats') loadGlobalMessages();
            if (tab === 'profile') loadProfile();
        };

            const input = document.getElementById('searchInput').value
