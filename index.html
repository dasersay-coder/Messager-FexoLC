<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FexoLC — Мессенджер</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, 
            query, orderBy, serverTimestamp, where, getDocs 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Твой конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD4xztMw6Lg6hjXBhQmmx7Uu_GNmqEsfAg",
            authDomain: "fexolc.firebaseapp.com",
            projectId: "fexolc",
            storageBucket: "fexolc.firebasestorage.app",
            messagingSenderId: "62913212380",
            appId: "1:62913212380:web:78029ad4fa0bc33d00a919",
            measurementId: "G-MT3HPVN7YY"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        let currentUser = null;

        // Хэширование пароля
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.showRegister = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        };
        window.showLogin = () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        };

        window.register = async function() {
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value.trim();

            if (!username || !password) return alert('Заполни логин и пароль!');
            if (password.length < 6) return alert('Пароль минимум 6 символов!');
            if (username.includes('@') || username.includes(' ')) return alert('Username без @ и пробелов!');

            try {
                const q = query(collection(db, "users"), where("username", "==", username));
                const snapshot = await getDocs(q);
                if (!snapshot.empty) return alert('Этот @username уже занят!');

                const hashedPassword = await hashPassword(password);
                await addDoc(collection(db, "users"), {
                    username, password: hashedPassword, createdAt: serverTimestamp()
                });

                alert('Аккаунт создан! Теперь войди.');
                showLogin();
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        };

        window.login = async function() {
            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) return alert('Заполни все поля!');

            try {
                const hashedPassword = await hashPassword(password);
                const q = query(collection(db, "users"), where("username", "==", username));
                const snapshot = await getDocs(q);
                if (snapshot.empty) return alert('Пользователь не найден!');

                const userData = snapshot.docs[0].data();
                if (userData.password !== hashedPassword) return alert('Неверный пароль!');

                currentUser = { id: snapshot.docs[0].id, username: userData.username };
                localStorage.setItem('fexolc_user', JSON.stringify(currentUser));
                enterChat();
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        };

        function enterChat() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('myUsername').textContent = '@' + currentUser.username;
            document.getElementById('myAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            loadMessages();
            loadUsers();
        }

        window.logout = () => {
            localStorage.removeItem('fexolc_user');
            location.reload();
        };

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;
            input.value = '';
            try {
                await addDoc(collection(db, "messages"), {
                    text, user: currentUser.username, userId: currentUser.id, timestamp: serverTimestamp()
                });
            } catch (e) { alert('Ошибка отправки: ' + e.message); }
        };

        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-chat">Пока нет сообщений. Напиши первым!</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.userId === currentUser.id;
                    const time = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message ' + (isMe ? 'me' : 'other');
                    msgDiv.innerHTML = `
                        ${!isMe ? `<div class="msg-user">@${data.user}</div>` : ''}
                        <div class="msg-text">${data.text}</div>
                        <div class="msg-time">${time} ${isMe ? '✓✓' : ''}</div>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function loadUsers() {
            const container = document.getElementById('usersContainer');
            onSnapshot(collection(db, "users"), (snapshot) => {
                container.innerHTML = '';
                let count = 0;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.username === currentUser.username) return;
                    count++;
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user-item';
                    userDiv.innerHTML = `
                        <div class="user-avatar">${data.username.charAt(0).toUpperCase()}</div>
                        <div class="user-info">
                            <div class="user-name">@${data.username}</div>
                        </div>
                    `;
                    container.appendChild(userDiv);
                });
                if (count === 0) container.innerHTML = '<div class="empty-users">Пока никого нет</div>';
            });
        }

        window.addEventListener('load', () => {
            const saved = localStorage.getItem('fexolc_user');
            if (saved) { currentUser = JSON.parse(saved); enterChat(); }
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 150, 255, 0.5) 0%, transparent 35%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 200, 0.4) 0%, transparent 35%),
                radial-gradient(circle at 50% 80%, rgba(100, 0, 255, 0.4) 0%, transparent 40%),
                linear-gradient(135deg, #0a0a2a, #0a1a2e, #0a2a1e);
            z-index: -1;
            animation: bgMove 15s ease infinite;
        }
        @keyframes bgMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(3deg); }
        }
        #authScreen {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .glass-card {
            width: 100%; max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px; padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .logo {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #00BFFF, #00FFAA, #8A2BE2);
            border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: 900; font-size: 2.2em;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 30px rgba(0, 191, 255, 0.5);
            animation: pulse 3s ease infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .glass-card h1 { color: #fff; font-size: 1.8em; margin-bottom: 8px; }
        .glass-card p { color: rgba(255,255,255,0.6); font-size: 0.9em; margin-bottom: 25px; }
        .glass-card input {
            width: 100%; padding: 18px 22px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff; font-size: 1em;
            outline: none; margin-bottom: 15px;
            transition: 0.3s;
        }
        .glass-card input:focus {
            border-color: rgba(0, 191, 255, 0.6);
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.3);
        }
        .glass-card input::placeholder { color: rgba(255,255,255,0.4); }
        .glass-btn {
            width: 100%; padding: 18px;
            border: none; border-radius: 18px;
            background: linear-gradient(135deg, #00BFFF, #00FFAA, #8A2BE2);
            color: #fff; font-size: 1.1em; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 25px rgba(0, 191, 255, 0.5);
            margin-bottom: 10px;
        }
        .glass-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0, 255, 170, 0.6); }
        .glass-btn:active { transform: scale(0.98); }
        .link-btn {
            background: transparent; border: none;
            color: rgba(255,255,255,0.7); cursor: pointer;
            font-size: 0.9em; text-decoration: underline; margin-top: 10px;
        }
        .link-btn:hover { color: #fff; }
        #chatScreen {
            display: none; flex-direction: column;
            height: 100vh; padding: 15px;
        }
        .chat-header {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            border-radius: 20px; padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px;
        }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #00BFFF, #00FFAA);
            border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: bold; font-size: 1.2em;
        }
        .chat-title { color: #fff; font-size: 1em; font-weight: bold; }
        .chat-status { color: #4CAF50; font-size: 0.75em; }
        .logout-btn {
            background: rgba(255, 68, 68, 0.3);
            border: 1px solid rgba(255, 68, 68, 0.5);
            color: #fff; padding: 8px 15px;
            border-radius: 12px; cursor: pointer; font-size: 0.8em;
        }
        .logout-btn:hover { background: rgba(255, 68, 68, 0.5); }
        .main-area { flex: 1; display: flex; gap: 15px; overflow: hidden; }
        .users-sidebar {
            width: 200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px; overflow-y: auto;
        }
        .users-sidebar h3 { color: #fff; font-size: 0.9em; margin-bottom: 15px; opacity: 0.8; }
        .user-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.3s; cursor: pointer;
        }
        .user-item:hover { background: rgba(255, 255, 255, 0.12); }
        .user-avatar {
            width: 35px; height: 35px;
            background: linear-gradient(135deg, #00BFFF, #00FFAA);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: bold; font-size: 0.9em;
        }
        .user-name { color: #fff; font-size: 0.85em; font-weight: bold; }
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages {
            flex: 1; overflow-y: auto; padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            max-width: 80%; padding: 12px 16px;
            border-radius: 18px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #00BFFF, #00FFAA);
            color: #fff;
            border-bottom-right-radius: 5px;
        }
        .message.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .msg-user { font-size: 0.7em; opacity: 0.7; margin-bottom: 4px; font-weight: bold; }
        .msg-text { font-size: 0.95em; line-height: 1.4; word-wrap: break-word; }
        .msg-time { font-size: 0.65em; opacity: 0.6; margin-top: 5px; text-align: right; }
        .empty-chat, .empty-users {
            color: rgba(255,255,255,0.4);
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9em;
        }
        .input-area {
            display: flex; gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            border-radius: 20px; padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .input-area input {
            flex: 1; padding: 14px 18px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff; font-size: 1em; outline: none;
        }
        .input-area input::placeholder { color: rgba(255,255,255,0.4); }
        .input-area button {
            width: 55px; height: 55px;
            border-radius: 18px; border: none;
            background: linear-gradient(135deg, #00BFFF, #00FFAA);
            color: #fff; font-size: 1.3em; cursor: pointer;
        }
        .input-area button:active { transform: scale(0.95); }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="glass-card">
            <div class="logo">F</div>
            <h1>FexoLC</h1>
            <p>Современный мессенджер</p>

            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="@username" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="off">
                <button class="glass-btn" onclick="login()">🔑 Войти</button>
                <button class="link-btn" onclick="showRegister()">Нет аккаунта? Зарегистрироваться</button>
            </div>

            <div id="registerForm" style="display:none;">
                <input type="text" id="regUsername" placeholder="@username (без @)" autocomplete="off">
                <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="off">
                <button class="glass-btn" onclick="register()">📝 Зарегистрироваться</button>
                <button class="link-btn" onclick="showLogin()">Уже есть аккаунт? Войти</button>
            </div>
        </div>
    </div>

    <div id="chatScreen">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="avatar" id="myAvatar">F</div>
                <div>
                    <div class="chat-title" id="myUsername">@user</div>
                    <div class="chat-status">● онлайн</div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="main-area">
            <div class="users-sidebar">
                <h3>👥 Пользователи</h3>
                <div id="usersContainer"></div>
            </div>

            <div class="chat-area">
                <div class="messages" id="messagesContainer"></div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
                    <button onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
